<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4fd8">
<title>Suure-Jaani Kool – Tunniplaan 2026/2027</title>
<style>
:root{--bg:#eef1f7;--card:#fff;--tx:#18202f;--mut:#667085;--ln:#e3e7ef;--ac:#1f4fd8;--ac2:#5b8cff;--acbg:#e9efff;--hl:#fff6d6;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1319;--card:#181d26;--tx:#e8ebf1;--mut:#9aa4b5;--ln:#2a313d;--ac:#7ba3ff;--ac2:#3f6fe0;--acbg:#1d2740;--hl:#2e2a14;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.top{background:linear-gradient(135deg,#1b3fb8,#3b74f0 60%,#5b8cff);color:#fff;padding:22px 16px 64px}
.top>div{max-width:1120px;margin:auto}
.top h1{margin:0;font-size:1.55rem;letter-spacing:-.01em}
.top p{margin:4px 0 0;opacity:.88;font-size:.92rem}
main{max-width:1120px;margin:-46px auto 24px;padding:0 12px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);border:1px solid var(--ln)}
.bar{padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.seg{display:inline-flex;background:var(--acbg);border-radius:12px;padding:3px}
.seg button{border:0;background:none;color:var(--ac);font:inherit;font-weight:600;padding:8px 16px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.pr{border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;padding:8px 14px;border-radius:10px;cursor:pointer}
.chips{padding:2px 14px 14px;display:flex;flex-direction:column;gap:8px}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.grp small{color:var(--mut);font-size:.75rem;width:92px;flex:none}
.chip{border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-size:.9rem;padding:5px 11px;border-radius:999px;cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.ttl{display:flex;align-items:baseline;gap:10px;margin:18px 4px 8px;flex-wrap:wrap}
.ttl h2{margin:0;font-size:1.3rem}.ttl span{color:var(--mut);font-size:.88rem}
.days{display:none;gap:6px;margin:0 0 10px}
.days button{flex:1;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-weight:600;padding:9px 0;border-radius:10px;cursor:pointer;position:relative}
.days button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.days button.td::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:#f5a623}
.sc{overflow-x:auto;border-radius:16px}
table{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;min-width:720px}
th,td{border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);padding:6px;vertical-align:top}
th{background:var(--acbg);color:var(--ac);font-weight:700;text-align:center;padding:10px 4px;position:sticky;top:0;z-index:2}
th.t,td.t{width:78px;text-align:center;color:var(--mut);font-size:.75rem;background:var(--card);position:sticky;left:0;z-index:1}
th.t{background:var(--acbg);z-index:3}
td.t b{display:block;font-size:1.05rem;color:var(--tx)}
tr:last-child td{border-bottom:0}th:last-child,td:last-child{border-right:0}
.today{background:var(--hl)}th.today{background:var(--ac);color:#fff}
td.now{box-shadow:inset 0 0 0 2px #f5a623}
.l{--c:#9aa4b5;margin:0 0 5px;padding:5px 8px;border-radius:8px;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 24%,var(--card));font-size:.84rem;line-height:1.3}
.l:last-child{margin:0}
.l b{display:block;font-size:.9rem}
.l span{color:color-mix(in srgb,var(--tx) 72%,transparent);font-size:.78rem}
.empty{text-align:center;color:var(--mut);padding:36px 12px}
details{margin:14px 4px;color:var(--mut);font-size:.82rem}
summary{cursor:pointer}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 14px;margin-top:8px}
footer{max-width:1120px;margin:0 auto 28px;padding:0 16px;color:var(--mut);font-size:.8rem}
@media (max-width:700px){
 .days{display:flex}.hide{display:none}
 table{min-width:0}th.t,td.t{width:58px;position:static}
 .grp small{width:100%}.top h1{font-size:1.3rem}
 .seg{width:100%}.seg button{flex:1;padding:8px 4px}
}
@media print{.top,.bar,.chips,.days,details,footer{display:none}.hide{display:table-cell!important}body{background:#fff}.card{box-shadow:none}table{min-width:0}}
</style>
</head>

<div class="top"><div><h1>Suure-Jaani Kool</h1><p>Tunniplaan 2026/2027 · I poolaasta</p></div></div>
<main>
 <div class="card"><div class="bar"><div class="seg" id="seg"></div><button class="pr" onclick="print()">🖨 Prindi</button></div><div class="chips" id="chips"></div></div>

 <div class="days" id="days"></div>
 <div class="card sc"><table id="tb"></table></div>

</main>
