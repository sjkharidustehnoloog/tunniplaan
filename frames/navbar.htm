<html>
<head>
<meta http-equiv="expires" content="0">

<title>Navigation</title>
<script language="JavaScript" src="../untisscripts.js"></script>
<link rel="stylesheet" href="../untisinfo.css" type="text/css">

<script LANGUAGE="JavaScript">
var topDir = "w";

function PopulateElementOption(Form, entries, flag)
{
 var idx = 0;
 if (flag & 1)
 {
   Form.element[0] = new Option("-Kõik-", 0);
   idx++;
 }
 if (flag == 0 || flag & 2)
 {
  for (i = 0; i < entries.length; i++, idx++)
  {
    Form.element[idx] = new Option(entries[i], i+1);
  }
 }
 if (idx > 0)
 {
    Form.element.selectedIndex = 0;
    doDisplayTimetable(Form, topDir);
 }
}

// Ainult klassid on alles, õpetajad ja ruumid on tühjad
var classes = ["1a","1b","2a","2b","3a","3b","4a","4b","5a","5b","6a","6b","7a","7b","8a","8b","9a","9b","10SO","10SP","11SO","11SP","12SO","12SP"];
var teachers = []; 
var rooms = [];
var flcl = 1; var flte = 0;

function ChangeElementOptions(Form)
{
 setselclass("empty");
 Form.element.length = 0;
 var type = Form.type[Form.type.selectedIndex].value;
 switch(type)
 {
    case "c": PopulateElementOption(Form, classes, 0); break;
    // Teised tüübid ei tee midagi, kuna andmeid pole
    case "t": Form.element[0] = new Option("Andmed puuduvad", 0); break;
    case "r": Form.element[0] = new Option("Andmed puuduvad", 0); break;
 }
 return;
}

function OnLoad(Form)
{
 setselclass("save");
 // Vali nädal 39
 for (var i = 0; i < Form.week.options.length; i++)
 {
   if (Form.week.options[i].value == "39")
     Form.week.options[i].selected = true;
 }
 // Vali tüübiks klassid
 Form.type.selectedIndex = 0;
 ChangeElementOptions(Form);

 // Vali automaatselt esimene klass
 if (Form.element && Form.element.length > 0)
 {
    Form.element.selectedIndex = 0;
    doDisplayTimetable(Form, topDir);
 }
}
</script>
</head>

<body class="nav" onload="OnLoad(document.forms[0]);">
<table width="100%" border="0" cellspacing="0" cellpadding="0" align="left">
<tr bgcolor="#FFFFFF">
<td>
<form name="NavBar" method="post">
<table width="100%" border="0" cellspacing="2" cellpadding="0">
  <tr>
   <td align="left" class="tabelle">
    <span class="selection">
     <nobr>Nädal<br><select name="week" class="selectbox" onChange="doDisplayTimetable(NavBar, topDir);">
      <option value="39">22.9.2025</option>
     </select></nobr>
    </span>
   </td>
   <td align="left" class="tabelle">
    <span class="selection">
     <nobr>Tüüp<br><select name="type" class="selectbox" onChange="ChangeElementOptions(NavBar);">
      <option value="c">Klassid</option>
     </select></nobr>
    </span>
   </td>
   <td align="left" class="tabelle">
    <span class="selection">
     <nobr>Klass<br><select name="element" class="selectbox" onChange="doDisplayTimetable(NavBar, topDir);">
      <option value="1">Vali klass...</option>
     </select></nobr>
    </span>
   </td>
   <td width="100%" class="tabelle"></td>
   <td align="right" class="tabelle">
    <nobr>
     <span class="schoolname">Suure-Jaani Kool</span><br>
     <span class="description">SJK Tunniplaan 2025/2026<br>Staatus: 15.10.2025</span>
    </nobr>
   </td>
  </tr>
</table>
</form>
</td>
</tr>
